name: Build TuyaChroma (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Opublikuj wydanie (tag v<wersja z programu>)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout pyinstaller==6.11.1

      - name: Program version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import tuyachroma; print(tuyachroma.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Release version matches the program
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "import tuyachroma; print(tuyachroma.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "tag ${{ github.ref_name }} != version $v"; exit 1 }

      - name: Tests (incl. Windows shared memory, DPAPI and GUI)
        timeout-minutes: 5
        run: python -m pytest -v --timeout=60

      - name: Icon
        run: python tools/make_icon.py icon.ico

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --name TuyaChroma --icon icon.ico
          --collect-submodules tinytuya --collect-submodules tuya_sharing
          --hidden-import pystray._win32 --hidden-import PIL.ImageTk
          --add-data "data/razer_devices.json;data"
          TuyaChroma.py

      - name: Smoke test (start, keep running, log written)
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          $p = Start-Process dist\TuyaChroma.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "exe exited with code $($p.ExitCode)"; Get-Content "$env:APPDATA\TuyaChroma\log.txt" -ErrorAction SilentlyContinue; exit 1 }
          Stop-Process -Id $p.Id
          Get-Content "$env:APPDATA\TuyaChroma\log.txt"
          if (-not (Select-String -Path "$env:APPDATA\TuyaChroma\log.txt" -Pattern "TuyaChroma .* starting")) { exit 1 }
          if (Select-String -Path "$env:APPDATA\TuyaChroma\log.txt" -Pattern "Traceback") { exit 1 }
          if (-not (Select-String -Path "$env:APPDATA\TuyaChroma\log.txt" -Pattern "Razer device database version")) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/TuyaChroma.exe, README.md, NOTICE pkg/
          Compress-Archive -Path pkg/* -DestinationPath TuyaChroma-windows.zip
          $hash = (Get-FileHash TuyaChroma-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  TuyaChroma-windows.zip" | Out-File -Encoding ascii TuyaChroma-windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: TuyaChroma-windows
          path: |
            TuyaChroma-windows.zip
            TuyaChroma-windows.zip.sha256

      - name: Release (on tag, or manual run with "release")
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TuyaChroma ${{ steps.ver.outputs.version }}
          files: |
            TuyaChroma-windows.zip
            TuyaChroma-windows.zip.sha256
          generate_release_notes: true
