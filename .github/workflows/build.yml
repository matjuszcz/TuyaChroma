name: Build TuyaChroma (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Opublikuj wydanie (tag v<wersja z programu>)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout pyinstaller==6.11.1

      - name: Program version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import tuyachroma; print(tuyachroma.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: New version? (publish automatically when the version has no release yet)
        id: rel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "publish=false" >> $env:GITHUB_OUTPUT; "v${{ steps.ver.outputs.version }} already published" }
          else { "publish=true" >> $env:GITHUB_OUTPUT; "v${{ steps.ver.outputs.version }} will be published" }
          exit 0

      - name: Release version matches the program
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "import tuyachroma; print(tuyachroma.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "tag ${{ github.ref_name }} != version $v"; exit 1 }

      - name: Tests (incl. Windows shared memory, DPAPI and GUI)
        timeout-minutes: 5
        run: python -m pytest -v --timeout=60

      - name: Icon
        run: python tools/make_icon.py icon.ico

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --name TuyaChroma --icon icon.ico
          --collect-submodules tinytuya --collect-submodules tuya_sharing
          --hidden-import pystray._win32 --hidden-import PIL.ImageTk
          --add-data "data/razer_devices.json;data"
          TuyaChroma.py

      - name: Smoke test (start, keep running, log written)
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          $p = Start-Process dist\TuyaChroma.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "exe exited with code $($p.ExitCode)"; Get-Content "$env:APPDATA\TuyaChroma\log.txt" -ErrorAction SilentlyContinue; exit 1 }
          Stop-Process -Id $p.Id
          Get-Content "$env:APPDATA\TuyaChroma\log.txt"
          if (-not (Select-String -Path "$env:APPDATA\TuyaChroma\log.txt" -Pattern "TuyaChroma .* starting")) { exit 1 }
          if (Select-String -Path "$env:APPDATA\TuyaChroma\log.txt" -Pattern "Traceback") { exit 1 }
          if (-not (Select-String -Path "$env:APPDATA\TuyaChroma\log.txt" -Pattern "Razer device database version")) { exit 1 }

      - name: Self-update test (swap the running exe, like an update does)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\swap"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item dist\TuyaChroma.exe "$dir\TuyaChroma.exe"
          Copy-Item dist\TuyaChroma.exe "$dir\new.exe"
          Add-Content "$dir\new.exe" "NEW-VERSION-MARKER"
          $env:APPDATA = "$env:RUNNER_TEMP\appdata-swap"
          $p = Start-Process "$dir\TuyaChroma.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { Write-Error "exe did not start"; exit 1 }
          python -c "from pathlib import Path; from tuyachroma import updater; d=Path(r'$dir'); old=updater.install(d/'new.exe', d/'TuyaChroma.exe'); print('swapped, previous kept as', old.name)"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path "$dir\TuyaChroma.exe" -Pattern "NEW-VERSION-MARKER" -SimpleMatch -Quiet)) { Write-Error "new exe not in place"; exit 1 }
          Get-Process TuyaChroma -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          python -c "from pathlib import Path; from tuyachroma import updater; d=Path(r'$dir'); updater.cleanup_old(d/'TuyaChroma.exe'); assert not (d/'TuyaChroma.exe.old').exists(); print('old version removed')"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/TuyaChroma.exe, README.md, NOTICE pkg/
          Compress-Archive -Path pkg/* -DestinationPath TuyaChroma-windows.zip
          $hash = (Get-FileHash TuyaChroma-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  TuyaChroma-windows.zip" | Out-File -Encoding ascii TuyaChroma-windows.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: TuyaChroma-windows
          path: |
            TuyaChroma-windows.zip
            TuyaChroma-windows.zip.sha256

      - name: Release (on tag, or manual run with "release")
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.release)
          || steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TuyaChroma ${{ steps.ver.outputs.version }}
          files: |
            TuyaChroma-windows.zip
            TuyaChroma-windows.zip.sha256
          generate_release_notes: true
