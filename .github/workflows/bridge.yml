name: TuyaChroma Bridge (Windows)

on:
  push:
    branches: [main]
    paths: ["bridge/**", ".github/workflows/bridge.yml"]
    tags: ["bridge-v*"]
  pull_request:
    paths: ["bridge/**", ".github/workflows/bridge.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller==6.11.1

      - name: Tests (incl. Windows shared-memory test)
        run: python -m pytest -v

      - name: Build exe
        run: pyinstaller --onefile --console --name TuyaChromaBridge --collect-submodules tinytuya TuyaChromaBridge.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          ./dist/TuyaChromaBridge.exe --version
          ./dist/TuyaChromaBridge.exe init -c "$env:RUNNER_TEMP/config.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./dist/TuyaChromaBridge.exe test -c "$env:RUNNER_TEMP/config.json"
          if (!(Test-Path "$env:RUNNER_TEMP/config.json")) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/TuyaChromaBridge.exe, README.md, NOTICE, config.example.json pkg/
          Compress-Archive -Path pkg/* -DestinationPath TuyaChromaBridge-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TuyaChromaBridge-windows
          path: bridge/TuyaChromaBridge-windows.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        uses: softprops/action-gh-release@v2
        with:
          files: bridge/TuyaChromaBridge-windows.zip
